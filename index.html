<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cache-busting on the entry HTML. All built JS/CSS are content-hashed
         (see vite.config.ts → rollupOptions.output), so as long as this HTML
         isn't stale, clients always pull the freshest hashed assets. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="theme-color" content="#FF5C1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pindrapp" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>Pindrapp — See it once. Find it forever.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
