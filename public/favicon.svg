<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FF8147"/>
      <stop offset="100%" stop-color="#FF5C1A"/>
    </radialGradient>
  </defs>
  <!-- background tile -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- pin teardrop outline -->
  <path
    d="M50 14 C 35 14, 23 25, 23 39 C 23 50, 33 58, 50 73 C 67 58, 77 50, 77 39 C 77 25, 65 14, 50 14 Z"
    fill="none"
    stroke="#fff"
    stroke-width="5.5"
    stroke-linejoin="round"
  />
  <!-- inner ring -->
  <circle cx="50" cy="37" r="7" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- dot below the pin -->
  <circle cx="50" cy="86" r="4" fill="#fff"/>
</svg>
